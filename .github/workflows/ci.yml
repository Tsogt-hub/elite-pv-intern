name: Contract app build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Build deployment image
        run: docker build --tag contract-app-check .
